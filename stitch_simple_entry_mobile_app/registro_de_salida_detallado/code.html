<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#d7dadc",
                        "primary-fixed-dim": "#ffb3ad",
                        "surface-tint": "#b91c24",
                        "surface-container-high": "#e5e9eb",
                        "on-error-container": "#93000a",
                        "background": "#f7fafc",
                        "secondary": "#585e6c",
                        "primary": "#b51822",
                        "surface-bright": "#f7fafc",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#6fd6dd",
                        "on-secondary-fixed-variant": "#414754",
                        "inverse-on-surface": "#eef1f3",
                        "surface": "#f7fafc",
                        "on-error": "#ffffff",
                        "outline": "#8f6f6d",
                        "tertiary": "#00666c",
                        "surface-variant": "#e0e3e5",
                        "on-primary-container": "#fffbff",
                        "surface-container-low": "#f1f4f6",
                        "on-secondary-fixed": "#161c27",
                        "secondary-container": "#dde2f3",
                        "tertiary-fixed": "#8cf2fa",
                        "on-surface": "#181c1e",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#008188",
                        "secondary-fixed-dim": "#c1c6d7",
                        "primary-container": "#d93537",
                        "on-background": "#181c1e",
                        "secondary-fixed": "#dde2f3",
                        "on-tertiary-fixed-variant": "#004f53",
                        "primary-fixed": "#ffdad7",
                        "on-surface-variant": "#5b403e",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#410004",
                        "on-primary-fixed-variant": "#930013",
                        "surface-container": "#ebeef0",
                        "on-secondary-container": "#5e6473",
                        "on-tertiary-fixed": "#002022",
                        "inverse-primary": "#ffb3ad",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "outline-variant": "#e4beba",
                        "on-tertiary-container": "#f4ffff",
                        "inverse-surface": "#2d3133"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "margin-mobile": "20px",
                        "base": "4px",
                        "xs": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "gutter-mobile": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .focus-ring:focus-within {
            border-color: #b51822 !important;
            box-shadow: 0 0 0 1px #b51822;
        }
    </style>
</head>
<body class="bg-background text-on-background">
<div class="app-container pb-[80px]">
<!-- TopAppBar -->
<header class="bg-primary text-on-primary w-full top-0 sticky z-10 flex items-center justify-between px-margin-mobile h-[64px]">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-on-primary active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</button>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile">Registrar Salida</h1>
</div>
<div class="w-6"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow p-margin-mobile bg-primary">
<!-- Search Section -->
<div class="mb-lg">
<label class="block text-white font-headline-md text-headline-md mb-sm">Búsqueda rápida por registro (C.I.)</label>
<div class="flex gap-2 items-center">
<div class="relative flex-grow">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-white/70" data-icon="search">search</span>
<input class="w-full bg-transparent border border-white/40 rounded-xl py-3 pl-10 pr-4 text-white placeholder-white/60 focus:outline-none focus:border-white" placeholder="Buscar estudiante/visita..." type="text"/>
</div>
<button class="bg-white text-primary p-3 rounded-xl flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="person_search">person_search</span>
</button>
</div>
</div>
<div class="h-[1px] bg-white/20 mb-lg"></div>
<!-- Form Section -->
<div class="space-y-lg">
<h2 class="text-white font-headline-md text-headline-md">Datos de Salida</h2>
<!-- Full Name -->
<div class="relative">
<div class="flex items-center border border-white/40 rounded-xl p-4 focus-within:border-white transition-colors">
<span class="material-symbols-outlined text-white mr-3" data-icon="person">person</span>
<input class="bg-transparent border-none p-0 text-white placeholder-white/60 w-full focus:ring-0 text-body-md font-body-md" placeholder="Nombre Completo" type="text"/>
</div>
</div>
<!-- ID Registration -->
<div class="relative">
<div class="flex items-center border border-white/40 rounded-xl p-4 focus-within:border-white transition-colors">
<span class="material-symbols-outlined text-white mr-3" data-icon="badge">badge</span>
<input class="bg-transparent border-none p-0 text-white placeholder-white/60 w-full focus:ring-0 text-body-md font-body-md" placeholder="Nº de C.I. o Registro" type="text"/>
</div>
</div>
<!-- Access & Time Row -->
<div class="grid grid-cols-2 gap-4">
<div class="relative">
<label class="absolute -top-2.5 left-3 bg-primary px-1 text-[12px] font-bold text-white/90">Salida</label>
<div class="flex items-center border border-white/40 rounded-xl p-4 focus-within:border-white transition-colors">
<span class="material-symbols-outlined text-white mr-2" data-icon="door_open">door_open</span>
<select class="bg-transparent border-none p-0 text-white w-full focus:ring-0 text-body-md font-body-md appearance-none">
<option class="text-on-surface">Principal</option>
<option class="text-on-surface">Lateral Norte</option>
<option class="text-on-surface">Estacionamiento</option>
</select>
<span class="material-symbols-outlined text-white pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<div class="relative">
<label class="absolute -top-2.5 left-3 bg-primary px-1 text-[12px] font-bold text-white/90">Hora</label>
<div class="flex items-center border border-white/40 rounded-xl p-4 transition-colors">
<span class="material-symbols-outlined text-white mr-2" data-icon="schedule">schedule</span>
<span class="text-white font-headline-md text-headline-md" id="current-time">17:30</span>
</div>
</div>
</div>
<!-- Observations -->
<div class="relative">
<div class="flex items-start border border-white/40 rounded-xl p-4 focus-within:border-white transition-colors">
<span class="material-symbols-outlined text-white mr-3 mt-1" data-icon="edit_note">edit_note</span>
<textarea class="bg-transparent border-none p-0 text-white placeholder-white/60 w-full focus:ring-0 text-body-md font-body-md resize-none" placeholder="Observaciones de Salida" rows="3"></textarea>
</div>
</div>
</div>
<!-- Main Action Button -->
<div class="mt-xl">
<button class="w-full bg-white text-primary font-bold py-4 rounded-full text-lg shadow-lg active:scale-[0.98] transition-all hover:bg-surface-container-low uppercase tracking-wider">
                    CONFIRMAR SALIDA
                </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-surface-variant flex justify-around items-center h-[80px] px-margin-mobile pb-safe">
<a class="flex flex-col items-center justify-center text-primary font-bold hover:bg-surface-container-low transition-colors px-4 py-2 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="how_to_reg" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
<span class="text-label-sm font-label-sm">Registration</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-low transition-colors px-4 py-2 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="text-label-sm font-label-sm">History</span>
</a>
</nav>
</div>
<script>
        // Real-time clock update
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Simple button interaction feedback
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('click', function() {
                this.classList.add('active:opacity-80');
            });
        });
    </script>
</body></html>
