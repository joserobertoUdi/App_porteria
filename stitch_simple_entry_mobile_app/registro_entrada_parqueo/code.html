<!DOCTYPE html>

<html class="light" lang="es"><head>

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom UI behaviors */
        .input-focus-ring:focus-within {
            border-color: #b51822; /* Primary color */
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen pb-24">
<!-- TopAppBar -->
<nav class="w-full top-0 sticky z-40 bg-surface border-b border-surface-variant flex items-center justify-between px-margin-mobile h-[64px]">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-100 ease-in-out hover:bg-surface-container-low rounded-full p-2 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Registrar Parqueo</h1>
</div>
<div class="flex items-center">
<!-- Optional Profile/Status icon could go here -->
</div>
</nav>
<main class="px-margin-mobile pt-lg space-y-lg">
<!-- Búsqueda rápida -->
<section class="space-y-sm">
<label class="text-label-md font-label-md text-secondary">Búsqueda rápida por placa</label>
<div class="flex gap-2">
<div class="relative flex-1 group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">search</span>
</div>
<input class="w-full h-12 bg-surface-container-lowest border border-surface-variant rounded-lg pl-10 pr-4 text-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Buscar placa..." type="text"/>
</div>
<button class="h-12 w-12 flex items-center justify-center bg-surface-container-highest border border-surface-variant rounded-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">person_search</span>
</button>
</div>
</section>
<!-- Formulario: Datos del Vehículo -->
<div class="bg-surface-container-lowest rounded-xl p-md border border-surface-variant shadow-sm space-y-lg">
<header class="flex items-center gap-2 border-b border-surface-variant pb-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">directions_car</span>
<h2 class="text-headline-md font-headline-md text-on-surface">Datos del Vehículo</h2>
</header>
<form class="space-y-md">
<!-- Placa -->
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant">Número de Placa</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-[20px]">directions_car</span>
<input class="w-full h-12 pl-10 pr-4 border border-surface-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary transition-all uppercase tracking-widest font-bold" placeholder="EJ. ABC-1234" type="text"/>
</div>
</div>
<!-- Conductor -->
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant">Nombre del Conductor</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-[20px]">person</span>
<input class="w-full h-12 pl-10 pr-4 border border-surface-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Nombre Completo" type="text"/>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<!-- Área/Zona -->
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant">Área/Zona</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-[20px]">local_parking</span>
<select class="w-full h-12 pl-10 pr-4 border border-surface-variant rounded-lg bg-surface appearance-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
<option>Zona A</option>
<option>Zona B</option>
<option>Visitantes</option>
<option>Docentes</option>
</select>
<span class="absolute right-3 material-symbols-outlined text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Hora -->
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant">Hora de Ingreso</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-[20px]">access_time</span>
<input class="w-full h-12 pl-10 pr-4 border border-surface-variant rounded-lg bg-surface-container-low text-secondary font-medium outline-none" id="current-time-display" readonly="" type="text"/>
</div>
</div>
</div>
<!-- Observaciones -->
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant">Observaciones</label>
<div class="relative">
<span class="absolute left-3 top-3 material-symbols-outlined text-outline text-[20px]">edit_note</span>
<textarea class="w-full pl-10 pr-4 py-2 border border-surface-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none" placeholder="Detalles adicionales..." rows="3"></textarea>
</div>
</div>
</form>
</div>
<!-- Call to Action -->
<div class="pt-md">
<button class="w-full h-14 bg-primary text-on-primary font-bold text-body-lg rounded-xl shadow-lg active:scale-[0.98] active:opacity-90 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                CONFIRMAR PARQUEO
            </button>
<p class="text-center text-label-sm text-secondary mt-md">Asegúrese de verificar los datos antes de confirmar.</p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-surface-variant flex justify-around items-center h-[80px] px-margin-mobile pb-safe">
<!-- Registration (Active) -->
<a class="flex flex-col items-center justify-center text-primary font-bold hover:bg-surface-container-low transition-colors px-4 py-2 rounded-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
<span class="text-label-sm font-label-sm mt-1">Registration</span>
</a>
<!-- History (Inactive) -->
<a class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-low transition-colors px-4 py-2 rounded-lg" href="#">
<span class="material-symbols-outlined">history</span>
<span class="text-label-sm font-label-sm mt-1">History</span>
</a>
</nav>
<script>
        // Set dynamic time
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const display = document.getElementById('current-time-display');
            if (display) {
                display.value = `${hours}:${minutes}`;
            }
        }
        updateTime();
        setInterval(updateTime, 10000); // Update every 10 seconds

        // Basic button interaction for demo
        document.querySelector('button.bg-primary').addEventListener('click', () => {
            const btn = document.querySelector('button.bg-primary');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> PROCESANDO...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check</span> REGISTRADO EXITOSAMENTE';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-tertiary');
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('bg-tertiary', 'opacity-80');
                    btn.classList.add('bg-primary');
                }, 2000);
            }, 1200);
        });
    </script>
</body></html>
