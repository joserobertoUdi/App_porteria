<div class="password">
  <h3 class="password__titulo">Restablecer contraseña</h3>
  <p class="password__descripcion">
    Usuario: <strong>{{ usuario().nombreCompleto }}</strong> · {{ usuario().documentoIdentidad }}
  </p>

  <form class="password__form" [formGroup]="formulario" (ngSubmit)="restablecer()" novalidate>
    <label class="password__campo">
      <span class="password__etiqueta">Nueva contraseña</span>
      <input
        class="password__input"
        formControlName="password"
        type="password"
        autocomplete="new-password"
        placeholder="Mínimo 6 caracteres"
      />
      @if (formulario.controls.password.touched && formulario.controls.password.invalid) {
        <span class="password__error">La contraseña debe tener al menos 6 caracteres.</span>
      }
    </label>

    <label class="password__campo">
      <span class="password__etiqueta">Confirmar contraseña</span>
      <input
        class="password__input"
        formControlName="confirmacion"
        type="password"
        autocomplete="new-password"
        placeholder="Repita la contraseña"
      />
      @if (formulario.touched && formulario.hasError('noCoinciden')) {
        <span class="password__error">Las contraseñas no coinciden.</span>
      }
    </label>

    <button class="password__boton" type="submit" [disabled]="guardando()">
      {{ guardando() ? 'Restableciendo…' : 'Restablecer contraseña' }}
    </button>
  </form>

  <p class="password__nota">
    Se limpiará el bloqueo por intentos fallidos de la cuenta.
  </p>
</div>
